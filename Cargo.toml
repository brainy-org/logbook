[workspace]
resolver = "3"
members = ["crates/engine", "crates/client", "crates/server", "crates/cli", "apps/logbook/src-tauri", "apps/logbook/plugins/recording"]
# The app needs its web pages built first (apps/logbook): `cargo build`
# and `cargo test` at the root build the rest only.
default-members = ["crates/engine", "crates/client", "crates/server", "crates/cli"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
publish = false
