[package]
name = "logbook-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "logbook_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
# Without the models here: the desktop adds them below, Android never
# (docs/decisions/2026-10-29-android-app.md).
logbook-client = { version = "0.1.0", path = "../../../crates/client", default-features = false }
logbook-engine = { version = "0.1.0", path = "../../../crates/engine", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The desktop: the local backend and its models, the keychain (secrets
# kept there by an earlier version), one window.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
logbook-client = { version = "0.1.0", path = "../../../crates/client", features = ["local"] }
logbook-engine = { version = "0.1.0", path = "../../../crates/engine", features = ["models"] }
tauri-plugin-single-instance = "2.5.4"

# Android: records and sends to a server; the foreground service that keeps
# it recording with the screen off.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-recording = { version = "0.1.0", path = "../plugins/recording" }
