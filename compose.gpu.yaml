# logbook-server on an NVIDIA GPU: an override of compose.yaml.
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
#
# Needs the NVIDIA driver and the NVIDIA container toolkit on the host. The
# image is the same: given the GPU, the server fetches libparakeet's CUDA
# build (linux/amd64 only) and runs on it. PARAKEET_DEVICE picks a card
# (CUDA0, CUDA1...); unset, the first.

services:
  server:
    platform: linux/amd64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
