[package]
name = "logbook-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The backend in this process (local.rs), with the engine's models. Off,
# meetings go to a server only: the Android app, which links no model code.
default = ["local"]
local = ["logbook-engine/models"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
futures-util = "0.3.34"
logbook-engine = { version = "0.1.0", path = "../engine", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "multipart", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sonora = "0.2.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
