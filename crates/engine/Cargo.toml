[package]
name = "logbook-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
getrandom = "0.4.3"
libloading = "0.9.0"
opus = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
